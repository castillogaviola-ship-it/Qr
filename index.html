<!DOCTYPE html>  <html>  
<head>  
    <title>ByteCake</title>  <meta name="viewport" content="width=device-width, initial-scale=1.0">  

<style>  
    * {  
        box-sizing: border-box;  
    }  

    body {  
        margin: 0;  
        font-family: Arial, sans-serif;  
        background-image: url("https://static.vecteezy.com/system/resources/thumbnails/022/989/161/small/abstract-background-with-some-smooth-lines-in-it-and-pink-a-pink-and-purple-background-with-a-pink-background-pink-and-purple-blur-soft-gradient-pastel-wallpaper-for-a-banner-website-media-advertising-photo.JPG");  
        background-size: cover;  
        background-position: center;  
        background-repeat: no-repeat;  
        background-attachment: fixed;  
        color: #4b2e1f;  
    }  

    .overlay {  
        min-height: 100vh;  
        background: rgba(255, 241, 214, 0.35);  
        display: flex;  
        justify-content: center;  
        align-items: center;  
        padding: 25px 18px;  
    }  

    .welcome {  
        width: 100%;  
        max-width: 430px;  
        background: rgba(255, 255, 255, 0.78);  
        backdrop-filter: blur(8px);  
        -webkit-backdrop-filter: blur(8px);  
        padding: 35px 25px;  
        border-radius: 28px;  
        text-align: center;  
        box-shadow: 0 10px 35px rgba(75, 46, 31, 0.18);  
    }  

    .logo {  
        width: 170px;  
        height: 170px;  
        object-fit: cover;  
        border-radius: 50%;  
        margin-bottom: 18px;  
        box-shadow: 0 8px 20px rgba(75, 46, 31, 0.20);  
    }  

    h1 {  
        margin: 0;  
        font-family: Georgia, serif;  
        font-size: 46px;  
        color: #6b3e26;  
        letter-spacing: 1px;  
    }  

    .tagline {  
        margin: 6px 0 25px;  
        font-family: cursive;  
        font-size: 17px;  
        color: #8b5a3c;  
    }  

    .quote-box {  
        background: rgba(255, 241, 214, 0.85);  
        padding: 17px 18px;  
        border-radius: 16px;  
        margin-bottom: 28px;  
    }  

    .quote {  
        margin: 0;  
        font-family: Georgia, serif;  
        font-size: 16px;  
        font-style: italic;  
        line-height: 1.6;  
        color: #4b2e1f;  
    }  

    .choices {  
        width: 100%;  
        display: flex;  
        flex-direction: column;  
        gap: 13px;  
    }  

    .choices a {  
        display: block;  
        width: 100%;  
        background: #6b3e26;  
        color: white;  
        text-decoration: none;  
        padding: 17px 14px;  
        border-radius: 13px;  
        font-size: 14px;  
        font-weight: bold;  
        letter-spacing: 0.4px;  
        box-shadow: 0 5px 12px rgba(75, 46, 31, 0.18);  
        transition: 0.2s;  
    }  

    .choices a:hover {  
        background: #8b5a3c;  
    }  

    .choices a:active {  
        transform: scale(0.97);  
    }  

    .footer {  
        margin-top: 25px;  
        font-size: 12px;  
        color: #8b5a3c;  
    }  

    @media (max-width: 360px) {  

        .welcome {  
            padding: 28px 18px;  
        }  

        .logo {  
            width: 145px;  
            height: 145px;  
        }  

        h1 {  
            font-size: 40px;  
        }  

        .tagline {  
            font-size: 15px;  
        }  

        .quote {  
            font-size: 14px;  
        }  

        .choices a {  
            font-size: 12px;  
            padding: 15px 10px;  
        }  
    }  
</style>

</head>  <body>  <div class="overlay">  

    <div class="welcome">  

        <img   
            src="https://i.pinimg.com/474x/03/de/61/03de6176daf7675e3d7edd36f7f9e0f6.jpg"  
            alt="ByteCake Pancake"  
            class="logo"  
        >  

        <h1>ByteCake</h1>  

        <p class="tagline">  
            A little sweetness can make your day better.  
        </p>  

        <div class="quote-box">  
            <p class="quote">  
                “Believe in yourself. You’re capable of more than you think.”  
            </p>  
        </div>  

        <div class="choices">

    <a href="./information.html">
        INFORMATION OF THE PANCAKES
    </a>

    <a href="./menu.html">
        📋 MENU
    </a>

    <a href="./page.html">
        📱 OUR PAGE
    </a>

</div>

</div>

</body>  
</html>
